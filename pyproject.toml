[project]
name = "nyaya"
version = "0.1.0"
description = "Agents that compile experience into rules: a sample-efficient symbolic runtime for cheap hardware"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nyaya = "nyaya.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nyaya"]
