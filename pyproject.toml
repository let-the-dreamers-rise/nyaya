[project]
name = "nyaya"
version = "0.1.0"
description = "Learning that costs zero tokens, and skills you can read: a symbolic runtime for cheap hardware, with the benchmark that prices everyone else's"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nyaya = "nyaya.cli:main"
nyaya-mcp = "nyaya.mcp_server:main"
nyaya-money = "nyaya.money.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nyaya", "nyaya.money"]
